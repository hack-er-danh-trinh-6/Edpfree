name: Windows Cloud PC - AnyDesk Direct

on:
  workflow_dispatch:

jobs:
  build:
    name: Khoi tao AnyDesk
    runs-on: windows-latest
    timeout-minutes: 360 # Gioi han toi da cua GitHub Actions la 6 tieng (360 phut)

    steps:
      - name: Tai va Cai dat AnyDesk
        shell: powershell
        run: |
          Write-Host "Dang tai AnyDesk..."
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "anydesk.exe" -UseBasicParsing
          
          Write-Host "Dang cai dat..."
          Start-Process -FilePath ".\anydesk.exe" -ArgumentList '--install "C:\Program Files (x86)\AnyDesk" --start-with-win --silent' -Wait
          
          # Dat mat khau ket noi (Thay 'MatKhau123' thanh mat khau ban muon)
          echo "MatKhau123" | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password

      - name: Lay ma ID AnyDesk
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $id = & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id
          Write-Host "=========================================="
          Write-Host "MA ID ANYDESK CUA BAN LA: $id"
          Write-Host "=========================================="

      - name: Duy tri ket noi
        shell: powershell
        run: |
          while ($true) {
            $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $process) {
              Write-Host "Khoi dong lai AnyDesk..."
              Start-Process -FilePath "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
            }
            Start-Sleep -Seconds 60
          }
